name: Release

# Windows and macOS minutes cost more on private repositories, so pull requests
# only run this when they touch what could break a build on those systems.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - crates/gbadn-emu/build.rs
      - crates/gbadn-emu/shim/**
      - Cargo.lock

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
            exe: ""
          - os: windows-latest
            name: windows-x86_64
            exe: .exe
          - os: macos-latest
            name: macos-arm64
            exe: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake libasound2-dev libudev-dev libxkbcommon-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@1.94.1
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME//\//-}"
          folder="gbadn-$version-${{ matrix.name }}"
          mkdir "$folder"
          cp "target/release/gbadn-emu${{ matrix.exe }}" "target/release/gbadn-studio${{ matrix.exe }}" "$folder/"
          cp README.md samples/demo.fasta "$folder/"
          cp vendor/mgba/LICENSE "$folder/LICENSE.mGBA.txt"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$folder.zip" "$folder"
          else
            tar czf "$folder.tar.gz" "$folder"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: gbadn-*-${{ matrix.name }}.*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" gbadn-* --generate-notes
