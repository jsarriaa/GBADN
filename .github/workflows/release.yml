name: Release

# Windows and macOS minutes cost more on private repositories, so pull requests
# only run this when they touch what could break a build on those systems.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - android/**
      - scripts/build-android.sh
      - crates/gbadn-emu/build.rs
      - crates/gbadn-emu/shim/**
      - Cargo.lock

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
            exe: ""
          - os: windows-latest
            name: windows-x86_64
            exe: .exe
          - os: macos-latest
            name: macos-arm64
            exe: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake libasound2-dev libudev-dev libxkbcommon-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@1.94.1
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME//\//-}"
          folder="gbadn-$version-${{ matrix.name }}"
          mkdir "$folder"
          cp "target/release/gbadn-emu${{ matrix.exe }}" "target/release/gbadn-studio${{ matrix.exe }}" "$folder/"
          cp README.md samples/demo.fasta "$folder/"
          cp LICENSE "$folder/LICENSE.txt"
          cp vendor/mgba/LICENSE "$folder/LICENSE.mGBA.txt"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$folder.zip" "$folder"
          else
            tar czf "$folder.tar.gz" "$folder"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: gbadn-*-${{ matrix.name }}.*
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: aarch64-linux-android
      - name: Load the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/gbadn.jks"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/gbadn.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          fi
      - name: Warn about a temporary key
        if: env.ANDROID_KEYSTORE == ''
        run: echo "::warning::This APK has a temporary signing key, so it can't update an existing install."
      - name: Build the APK
        run: scripts/build-android.sh "gbadn-${GITHUB_REF_NAME//\//-}-android-arm64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64
          path: gbadn-*-android-arm64.apk
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" gbadn-* --generate-notes
