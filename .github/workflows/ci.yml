name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libasound2-dev libudev-dev libxkbcommon-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Draw the genome study of the demo cartridge
        run: |
          pip install -r scripts/requirements-study.txt
          cargo run -p gbadn-study -- samples/demo.fasta "$RUNNER_TEMP/study"
          python scripts/plot-study.py "$RUNNER_TEMP/study" "$RUNNER_TEMP/figures"
