[package]
name = "gbadn-emu"
description = "A Game Boy Advance emulator that only reads FASTA genomic files"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
eframe = "0.35"
gbadn-codec = { path = "../gbadn-codec" }
rfd = "0.15"
sdl2 = "0.38"
thiserror = "2"

[dev-dependencies]
egui_kittest = "0.35"

[build-dependencies]
cc = "1"
cmake = "0.1"
