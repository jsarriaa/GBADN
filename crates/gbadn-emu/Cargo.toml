[package]
name = "gbadn-emu"
description = "A Game Boy Advance emulator that only reads FASTA genomic files"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
cpal = "0.18"
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "persistence"] }
gbadn-codec = { path = "../gbadn-codec" }
gilrs = "0.11"
thiserror = "2"

# Accessibility support doesn't build with Android's NativeActivity.
[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.35", default-features = false, features = ["accesskit", "wayland", "x11"] }
rfd = "0.15"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
eframe = { version = "0.35", default-features = false, features = ["android-native-activity"] }
jni = "0.21"
log = "0.4"
winit = { version = "0.30", default-features = false }

[dev-dependencies]
egui_kittest = "0.35"

[build-dependencies]
cc = "1"
cmake = "0.1"
