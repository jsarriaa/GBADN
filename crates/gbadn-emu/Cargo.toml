[package]
name = "gbadn-emu"
description = "A Game Boy Advance emulator that only reads FASTA genomic files"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
cpal = "0.18"
eframe = { version = "0.35", features = ["persistence"] }
gbadn-codec = { path = "../gbadn-codec" }
gilrs = "0.11"
thiserror = "2"

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.15"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
eframe = { version = "0.35", features = ["android-native-activity"] }
jni = "0.21"
log = "0.4"

[dev-dependencies]
egui_kittest = "0.35"

[build-dependencies]
cc = "1"
cmake = "0.1"
