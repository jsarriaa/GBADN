[package]
name = "gbadn-emu"
description = "A Game Boy Advance emulator that only reads FASTA genomic files"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
cpal = "0.18"
eframe = { version = "0.35", features = ["persistence"] }
gbadn-codec = { path = "../gbadn-codec" }
gilrs = "0.11"
rfd = "0.15"
thiserror = "2"

[dev-dependencies]
egui_kittest = "0.35"

[build-dependencies]
cc = "1"
cmake = "0.1"
